<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YSB vs SEK – Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<link href="styles.css" rel="stylesheet">
</head>
<body>
<svg width="0" height="0" class="symbols" aria-hidden="true">
  <defs>
    <symbol id="ball" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" fill="#ff8a1f"/>
      <circle cx="50" cy="50" r="46" fill="url(#bg)"/>
      <g fill="none" stroke="#1a0d00" stroke-width="3" stroke-linecap="round">
        <path d="M50 4v92M4 50h92"/>
        <path d="M17 17Q40 50 17 83"/>
        <path d="M83 17Q60 50 83 83"/>
      </g>
    </symbol>
    <radialGradient id="bg" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></radialGradient>
    <symbol id="bolt" viewBox="0 0 100 100"><polygon points="58,0 18,56 44,56 32,100 82,38 54,38" fill="#fff"/></symbol>
    <symbol id="jersey" viewBox="0 0 100 112">
      <path d="M30 4Q50 32 70 4L82 9L86 34L77 44L79 106Q79 109 76 109L24 109Q21 109 21 106L23 44L14 34L18 9Z" fill="currentColor"/>
      <path d="M30 4Q50 32 70 4" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="3"/>
      <path d="M21 100H79" stroke="#fff" stroke-opacity=".6" stroke-width="3"/>
    </symbol>
  </defs>
</svg>
<div class="glow"></div>
<div class="wrap">
  <div class="screen">

  <section class="arena">
    <div class="half l has" id="sl"><img class="ph" src="images/anthony-edwards.jpg" alt="" decoding="async">
      <svg class="bg bolt-top" viewBox="0 0 100 100"><use href="#bolt"/></svg><svg class="bg bolt-middle" viewBox="0 0 100 100"><use href="#bolt"/></svg><svg class="bg bolt-bottom" viewBox="0 0 100 100"><use href="#bolt"/></svg>
      <svg class="player" viewBox="0 -40 200 400" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M100 82V190" stroke-width="40"/><path d="M100 98L138 62L150 22" stroke-width="15"/><path d="M100 104L64 134L88 160" stroke-width="15"/><path d="M100 190L76 262L82 338" stroke-width="19"/><path d="M100 190L136 252L152 330" stroke-width="19"/></g><circle cx="100" cy="46" r="23" fill="currentColor"/><circle cx="152" cy="-6" r="24" fill="#ff8a1f"/><path d="M152 -30V18M128 -6H176" stroke="#1a0d00" stroke-width="3"/></svg>
    </div>
    <div class="half r has" id="sr"><img class="ph" src="images/luguentz-dort.jpg" alt="" decoding="async">
      <svg class="bg bolt-top" viewBox="0 0 100 100"><use href="#bolt"/></svg><svg class="bg bolt-middle" viewBox="0 0 100 100"><use href="#bolt"/></svg><svg class="bg bolt-bottom" viewBox="0 0 100 100"><use href="#bolt"/></svg>
      <svg class="player" viewBox="0 -40 200 400" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M100 82V190" stroke-width="40"/><path d="M100 98L138 62L150 22" stroke-width="15"/><path d="M100 104L64 134L88 160" stroke-width="15"/><path d="M100 190L76 262L82 338" stroke-width="19"/><path d="M100 190L136 252L152 330" stroke-width="19"/></g><circle cx="100" cy="46" r="23" fill="currentColor"/><circle cx="152" cy="-6" r="24" fill="#ff8a1f"/><path d="M152 -30V18M128 -6H176" stroke="#1a0d00" stroke-width="3"/></svg>
    </div>
    <svg class="zig" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true">
      <path d="M530 0 L470 340 L530 310 L470 670 L530 640 L470 1000"/>
    </svg>
    <div class="center" role="region" aria-label="Scoreboard">
      <div class="nums">
        <div class="score-team"><span class="score-label">YSB</span><span class="n nl" id="totL">0</span></div>
        <span aria-hidden="true"></span>
        <div class="score-team sek"><span class="score-label">SEK</span><span class="n nr" id="totR">0</span></div>
        <span class="series-count nl" id="seriesL" aria-label="YSB series wins">0</span>
        <span aria-hidden="true"></span>
        <span class="series-count nr" id="seriesR" aria-label="SEK series wins">0</span>
      </div>
      <div class="gc" id="gc">0 MATCHES</div>
    </div>
  </section>
  <div class="music">
    <audio id="music" controls preload="metadata" aria-label="Stole Ya Flow">
      <source src="stole_ya_flow.mp3" type="audio/mpeg">
      <a href="stole_ya_flow.mp3">Listen to Stole Ya Flow</a>
    </audio>
  </div>
  <a class="hint" href="#log" id="hint"><span>MATCH LOG</span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></a>
  </div>

  <section class="card" id="log">
    <h2>MATCH LOG</h2>
    <div class="log-filters">
      <label>From<input type="date" id="dateFrom"></label>
      <label>To<input type="date" id="dateTo"></label>
      <label>Game<select id="version"><option value="">All versions</option></select></label>
      <button class="ghost" id="clearFilters">Clear filters</button>
    </div>
    <div class="log" id="rows"></div>
    <div class="empty" id="empty"><svg viewBox="0 0 100 100"><use href="#ball"/></svg>No games yet. Tip-off!</div>
    <div class="empty" id="filterEmpty" role="status" hidden>No matches for these filters.</div>
  </section>

</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
